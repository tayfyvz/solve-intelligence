services:
  server:
    container_name: EngineeringChallenge_Server
    build: ./server
    ports:
      - "8000:8000"
    volumes:
      - ./server:/usr/src/app
      # Anonymous volume: keeps the image's .venv from being masked by the bind
      # mount above (the host .venv is built for a different platform).
      - /usr/src/app/.venv
    environment:
      # Wins over the same key in .env — the container's database always belongs in the
      # bind-mounted data/ directory, whatever a developer's .env says for local runs.
      DATABASE_URL: sqlite:///./data/app.db
    env_file:
      - ./server/.env

  client:
    container_name: EngineeringChallenge_Client
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
