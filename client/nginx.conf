# The production front door. Used only by the `production` target of client/Dockerfile;
# the compose stack runs the `dev` target and never reads this file.

server {
    listen 80;
    server_name _;

    # PLAN §28.2.4. The application's own 413s (max_content_bytes = 1_000_000) are
    # enforced AFTER FastAPI has read and parsed the body, and uvicorn has no maximum
    # body size of its own — so a 500 MB POST is buffered into memory before any check
    # runs. This is the only limit that stops the bytes at the edge, which is why "we cap
    # at 1 MB" is otherwise only true of well-behaved clients. 2m, not 1m: the cap is on
    # the request, and the JSON envelope around a 1 MB document is larger than 1 MB.
    client_max_body_size 2m;

    # Same-origin API (option 1 of §28.2.2). The browser calls /api/... on this host and
    # nginx forwards it, so nothing environment-specific is inlined into the bundle at
    # build time and the CORS middleware becomes a no-op for the browser path.
    location /api/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer than the server's own ai_request_timeout_seconds = 75.0, so nginx never
        # reports a timeout for a request the server is still answering successfully.
        # This is the same strictly-increasing chain as PLAN §3.4, with a hop added:
        # 90 s (client) > 85 s (here) > 75 s (server) > 65 s (graph deadline).
        proxy_read_timeout 85s;
    }

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: the app is client-routed, so any unmatched path is index.html and
    # not a 404. Without it a reload on any deep link 404s from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
