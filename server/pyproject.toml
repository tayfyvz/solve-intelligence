[project]
name = "engineering-challenge-server"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn>=0.32.0,<0.33",
    "openai>=1.57.0,<2.0",
    "pydantic>=2.10.0,<3.0",
    "python-dotenv>=1.0.1,<2.0",
    "sqlalchemy>=2.0.36,<3.0",
    "httpx>=0.28.0,<0.29",
    "beautifulsoup4>=4.12,<5.0",
    "nh3>=0.3.0,<0.4",
    "pydantic-settings>=2.6,<3.0",
    # Pinned below 2 because the graph API IS the design (PLAN §22). A major bump is a
    # rewrite, not an upgrade. 21 transitive packages, +17 MiB of image layer —
    # measured, and justified in TECHNOLOGY §2.5 and PLAN §1.4.
    "langgraph>=1.2,<2.0",
]

# PEP 735 group, not [project.dependencies]: the Dockerfile builds with
# `uv sync --frozen --no-dev`, so anything here stays out of the image.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `db: Session = Depends(get_db)` is the FastAPI idiom; B008 flags it otherwise.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Required, or `import app.*` does not resolve from tests/.
pythonpath = ["."]
